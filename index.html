<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />

</head>

<body>
    <main class="page" id="inicio">
        <section aria-label="Los Tealeros" class="hero">
            <div class="hero-content"><img alt="Logotipo de Los Tealeros" class="brand" decoding="async" loading="eager"

        <section class="intro" id="productos">
            <div class="leaf-accent top-right"><svg aria-hidden="true" viewbox="0 0 140 140">
                    <path d="M6 115C18 45 65 17 137 8c-12 70-54 116-131 107Z" fill="#a5c35c"></path>
                    <path d="M7 114C48 77 84 47 137 8" fill="none" stroke="#6d983e" stroke-width="3"></path>
                    <path d="M39 88 30 48M68 63 71 27M95 41l27 10M56 74l37 14" fill="none" stroke="#79a341"
                        stroke-width="2"></path>
                </svg></div>
            <div class="leaf-accent mid-left"><svg aria-hidden="true" viewbox="0 0 140 140">
                    <path d="M6 115C18 45 65 17 137 8c-12 70-54 116-131 107Z" fill="#a5c35c"></path>
                    <path d="M7 114C48 77 84 47 137 8" fill="none" stroke="#6d983e" stroke-width="3"></path>
                    <path d="M39 88 30 48M68 63 71 27M95 41l27 10M56 74l37 14" fill="none" stroke="#79a341"
                        stroke-width="2"></path>
                </svg></div>
            <div class="leaf-accent bottom-right"><svg aria-hidden="true" viewbox="0 0 140 140">
                    <path d="M6 115C18 45 65 17 137 8c-12 70-54 116-131 107Z" fill="#a5c35c"></path>
                    <path d="M7 114C48 77 84 47 137 8" fill="none" stroke="#6d983e" stroke-width="3"></path>
                    <path d="M39 88 30 48M68 63 71 27M95 41l27 10M56 74l37 14" fill="none" stroke="#79a341"
                        stroke-width="2"></path>
                </svg></div>
            <div class="video-card"><img alt="Plantación de té al amanecer" decoding="async" height="1333"
                    src="assets/visual-04.webp" width="1000" /><button aria-label="Ver video de presentación"
                    class="play" id="play"><svg fill="currentColor" height="31" viewbox="0 0 24 24" width="31">
                        <path d="M7 3v18l14-9z"></path>
                    </svg></button><span class="video-caption">▣   Video de presentación</span></div>
            <h2 class="section-title">Nuestros productos</h2>
            <div class="products">
                <article class="product"><img alt="Hojas de té verde" decoding="async" fetchpriority="low" height="587"
                        loading="lazy" src="assets/visual-05.webp" width="440" /><span>Té verde</span></article>
                <article class="product"><img alt="Té negro en hebras en recipiente de madera" decoding="async"
                        fetchpriority="low" height="567" loading="lazy" src="assets/visual-06.webp"
                        width="720" /><span>Té negro</span></article>
                <article class="product"><img alt="Miel de abeja natural en frasco de cristal" decoding="async"
                        fetchpriority="low" height="720" loading="lazy" src="assets/visual-07.webp"
                        width="719" /><span>Miel de abeja</span></article>
            </div>
            <div class="actions"><a class="cta primary"
                    href="https://wa.me/51900190042?text=Hola%2C%20quisiera%20conocer%20los%20productos%20de%20Los%20Tealeros."
                    id="catalog" rel="noopener noreferrer" target="_blank"><svg fill="currentColor" viewbox="0 0 24 24">
                        <path d="M21 2C12 3 5 8 3 18c5-5 9-7 16-10-7 5-11 9-13 14C17 22 22 12 21 2z"></path>
                    </svg>Conoce nuestros productos <span aria-hidden="true">›</span></a><a class="cta secondary"
                    href="https://wa.me/51900190042?text=Hola%2C%20quisiera%20conocer%20los%20productos%20de%20Los%20Tealeros."
                    id="whatsapp" rel="noopener noreferrer" target="_blank"><svg fill="currentColor"
                        viewbox="0 0 24 24">
                        <path
                            d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.8c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.3.2-.4.5-.9.1-.2 0-.4 0-.5L9.7 8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.3 1 2.5c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.2.2-.5.2-1 .1-1.1z">
                        </path>
                    </svg>Pedir por WhatsApp</a></div>
            <p class="notice" id="notice">+51900190042</p>
        </section>
        <footer class="footer" id="footer">
            <div class="social"><a aria-label="Instagram" href="https://www.instagram.com/los_tealeros/"
                    rel="noopener noreferrer" target="_blank"><svg fill="none" stroke="currentColor" stroke-width="2"
                        viewbox="0 0 24 24">
                        <rect height="18" rx="5" width="18" x="3" y="3"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" fill="currentColor" r="1" stroke="none"></circle>
                    </svg></a><i class="sep"></i><a aria-label="Facebook de Los Tealeros"
                    href="https://www.facebook.com/profile.php?id=61571322086987" rel="noopener noreferrer"
                    target="_blank"><svg fill="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M13.8 22v-9h3l.5-3.5h-3.5V7.3c0-1 .3-1.7 1.8-1.7h1.9V2.4c-.3 0-1.4-.2-2.7-.2-2.8 0-4.7 1.7-4.7 4.9v2.4H7V13h3.1v9z">
                        </path>
                    </svg></a><i class="sep"></i><a aria-label="TikTok de Los Tealeros"
                    href="https://www.tiktok.com/@los_tealeros" rel="noopener noreferrer" target="_blank"><svg
                        fill="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M16.7 2c.2 2.2 1.5 3.6 3.7 3.8v3.4a8.2 8.2 0 0 1-3.7-1.1v7.3c0 4-3.2 6.6-6.7 6.6a6.6 6.6 0 0 1 0-13.2c.4 0 .8 0 1.1.1v3.6a3.1 3.1 0 1 0 2 2.9V2z">
                        </path>
                    </svg></a></div>

            <p class="footnote">Los Tealeros · Design dvmendo</p>
        </footer>
        <a class="back-to-top" href="#inicio" aria-label="Volver al inicio" title="Volver al inicio"><svg
                aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 14 6-6 6 6" />
            </svg></a>
    </main>
    <div aria-label="Video de presentación" aria-modal="true" class="video-modal" id="modal" role="dialog">
        <div class="modal-box"><button aria-label="Cerrar video" class="close" id="close">×</button><iframe
                allow="autoplay; encrypted-media; picture-in-picture" class="embed" id="frame" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin" title="Reel de Los Tealeros"></iframe>
            <p class="fallback">Si Instagram no permite reproducirlo aquí, <a
                    href="https://www.instagram.com/reel/DPYwV7FkbJl/" rel="noopener noreferrer" target="_blank">ver el
                    Reel en
                    Instagram</a>.</p>
        </div>
    </div>
    <script>const modal = document.getElementById('modal'), frame = document.getElementById('frame'); document.getElementById('play').onclick = () => { modal.classList.add('open'); frame.src = 'https://www.instagram.com/reel/DPYwV7FkbJl/embed/'; document.body.style.overflow = 'hidden' }; function closeVideo() { modal.classList.remove('open'); frame.src = ''; document.body.style.overflow = '' } document.getElementById('close').onclick = closeVideo; modal.addEventListener('click', e => { if (e.target === modal) closeVideo() }); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo() });</script>
</body>

</html>
